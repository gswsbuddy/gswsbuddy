<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RBK Retailer ID Finder</title>
  <style>
    /* Your provided CSS */
    body {
      font-family: Arial, sans-serif;
      background: #f4faff;
      padding: 20px;
    }

    h2 {
      text-align: center;
      color: #005a9c;
    }

    label {
      font-weight: bold;
    }

    form {
      max-width: 350px;
      margin: auto;
      background: #fff;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }

    select {
      width: 100%;
      padding: 40px;
      margin: 8px 0 16px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .filter-options {
      text-align: center;
      margin-top: 20px;
    }

    .filter-options select {
      padding: 6px;
      border-radius: 5px;
      border: 1px solid #aaa;
    }

    #output {
      margin-top: 30px;
      background: #e8f0fe;
      padding: 20px;
      border-radius: 10px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #ccc;
    }

    th {
      background-color: #dbe9ff;
      color: #003366;
    }

    .yes {
      color: green;
      font-weight: bold;
    }

    .no {
      color: red;
      font-weight: bold;
    }

    #submitBtn {
      padding: 8px 16px;
      background-color: #0078D4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 40px;
    }

    #suggestions {
      border: 1px solid #ccc;
      border-radius: 3px;
      background: #fff;
      max-height: 200px;
      overflow-y: auto;
      margin-top: -10px;
      position: relative;
      z-index: 10;
    }

    .suggestion {
      padding: 4px;
      cursor: pointer;
    }
    #rskInput {
    width: 100%;         /* Full width of the form container */
    padding: 8px 16px;  /* More inner space for comfort */
    font-size: 18px;     /* Bigger text for visibility */
    border-radius: 6px;  /* Slightly rounder corners */
    border: 1px solid #ccc;
    box-sizing: border-box;
    }

    .suggestion:hover {
      background-color: #e0e0e0;
    }
  </style>
</head>
<body>
  <h2>RBK Retailer ID Finder</h2>
  <form>
    <label for="rskInput">Enter RBK Name:</label>
    <input type="text" id="rskInput" placeholder="Enter Your RBK NAME..." autocomplete="off">
    <hr>
    <div id="suggestions"></div>
    <button type="button" id="submitBtn">Submit</button>
  </form>

  <div id="output"></div>

  <script>
    let rskData = {};

    // Load external JSON file
    fetch('dbt pins.json')
      .then(response => response.json())
      .then(data => {
        rskData = data;
      })
      .catch(error => {
        console.error("Error loading JSON:", error);
        document.getElementById("output").innerHTML = "<p style='color:red;'>Failed to load RSK data.</p>";
      });

    const input = document.getElementById("rskInput");
    const suggestionsBox = document.getElementById("suggestions");
    const outputBox = document.getElementById("output");

    input.addEventListener("input", () => {
      const query = input.value.trim().toLowerCase();
      suggestionsBox.innerHTML = "";

      if (query.length === 0) return;

      const matches = Object.keys(rskData).filter(rsk =>
        rsk.toLowerCase().includes(query)
      );

      matches.forEach(match => {
        const div = document.createElement("div");
        div.classList.add("suggestion");
        div.textContent = match;
        div.addEventListener("click", () => {
          input.value = match;
          suggestionsBox.innerHTML = "";
        });
        suggestionsBox.appendChild(div);
      });
    });

    document.getElementById("submitBtn").addEventListener("click", () => {
      const rsk = input.value.trim();
      const entry = rskData[rsk];

      if (entry) {
        outputBox.innerHTML = `
          <table>
            <tr><th>Dealer ID</th><td>${entry.dealerId}</td></tr>
            <tr><th>Agency Name</th><td>${entry.agencyName}</td></tr>
            <tr><th>POS Pin</th><td>${entry.posPin}</td></tr>
          </table>
        `;
      } else {
        outputBox.innerHTML = `<p style="color:red;">RSK not found. Please check the name.</p>`;
      }
    });
  </script>
</body>
</html>
