<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Urea Tokens Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/docx@7.7.0/build/index.min.js"></script>
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FKVZ9P09W5"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-FKVZ9P09W5');
</script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f4f6f8;
    }

    h2 {
      color: #0078D4;
      text-align: center;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      background-color: #0078D4;
      color: white;
    }

    button:hover {
      background-color: #005a9e;
    }
  </style>
</head>
<body>

  <h2>🧾 Urea Tokens Generator</h2>

  <form id="tokenForm">
    <label>Date:</label>
    <input type="date" id="distDate" required>

    <label>RSK Name:</label>
    <input type="text" id="rskName" required>

    <label>Mandal:</label>
    <input type="text" id="mandal" required>

    <label>Number of Tokens:</label>
    <input type="number" id="tokenCount" min="1" max="500" required>

    <button type="submit">Generate Word File</button>
  </form>

  <script>
    document.getElementById("tokenForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const rawDate = new Date(document.getElementById("distDate").value);
      const date = `${rawDate.getDate()}-${rawDate.toLocaleString('en-us', { month: 'short' })}-${rawDate.getFullYear()}`;
      const rsk = document.getElementById("rskName").value.trim();
      const mandal = document.getElementById("mandal").value.trim();
      const count = parseInt(document.getElementById("tokenCount").value);

      const { Document, Packer, Paragraph, Table, TableRow, TableCell, WidthType, TextRun, PageBreak, HeightRule } = window.docx;

      const sections = [];
      let tokenIndex = 1;

      while (tokenIndex <= count) {
        const rows = [];

        for (let r = 0; r < 4; r++) {
          const cells = [];

          for (let c = 0; c < 3; c++) {
  if (tokenIndex <= count) {
    const cellContent = [
      new Paragraph({
        children: [new TextRun({
          text: `Urea Distribution – ${date}`,
          font: "Arial",
          size: 20,
          bold: true
        })],
        alignment: "center",
        spacing: { after: 400 }
      }),
      new Paragraph({
        children: [new TextRun({
          text: `${tokenIndex}`,
          font: "Arial",
          size: 38,
          bold: true
        })],
        alignment: "center",
        spacing: { after: 800 }
      }),
      new Paragraph({
        children: [new TextRun({
          text: "Signature of VAA / MAO",
          font: "Arial",
          size: 24,
          bold: true
        })],
        alignment: "center",
        spacing: { after: 100 }
      }),
      new Paragraph({
        children: [new TextRun({
          text: `${rsk} RSK`,
          font: "Arial",
          size: 24,
          bold: true
        })],
        alignment: "center"
      }),
      new Paragraph({
        children: [new TextRun({
          text: `${mandal} Mandal`,
          font: "Arial",
          size: 28,
          bold: true
        })],
        alignment: "center"
      })
    ];
              cells.push(new TableCell({
                width: { size: 3968, type: WidthType.DXA }, // ~7cm
                children: cellContent,
                margins: { top: 100, bottom: 100, left: 100, right: 100 }
              }));

              tokenIndex++;
            } else {
              cells.push(new TableCell({
                width: { size: 3968, type: WidthType.DXA },
                children: [new Paragraph("")],
              }));
            }
          }

          rows.push(new TableRow({
            children: cells,
            height: { value: 3205, rule: HeightRule.EXACT } // ~3.3cm
          }));
        }

        const table = new Table({
          rows,
          width: { size: 9906, type: WidthType.DXA } // full A4 width
        });

        sections.push({
          properties: {
            page: {
              size: { width: 11906, height: 16838 }, // A4
              margin: { top: 720, bottom: 720, left: 720, right: 720 } // 1.5cm
            }
          },
          children: [
            new Paragraph({ text: "", spacing: { after: 200 } }),
            table,
            new Paragraph({ children: [new PageBreak()] })
          ]
        });
      }

      const doc = new Document({ sections });

      const blob = await Packer.toBlob(doc);
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${rsk.replace(/\s+/g, "_")}_Tokens.docx`;
      a.click();
      URL.revokeObjectURL(url);
    });
  </script>

</body>
</html>
