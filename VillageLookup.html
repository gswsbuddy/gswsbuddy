<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <title>Know Your Village Code</title>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FKVZ9P09W5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-FKVZ9P09W5');
  </script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #f0f4f8; color: #333; }
    h1 { text-align: center; color: #0078D4; }
    .dropdowns { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
    select { padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; background: white; min-width: 200px; }
    button { display: block; margin: 0 auto; padding: 12px 24px; background-color: #0078D4; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 16px; }
    button:hover { background-color: #005a9e; }
    #output { margin-top: 30px; background: #e8f0fe; padding: 20px; border-radius: 10px; max-width: 600px; margin-left: auto; margin-right: auto; font-size: 18px; line-height: 1.6; box-shadow: 0 2px 6px rgba(0,0,0,0.1); display: none; }
  </style>
</head>
<body>

  <h1>🏡 Village Code Finder</h1>

  <div class="dropdowns">
    <select id="districtSelect"><option>జిల్లా ఎంచుకోండి</option></select>
    <select id="mandalSelect"><option>మండలం ఎంచుకోండి</option></select>
    <select id="villageSelect"><option>గ్రామం ఎంచుకోండి</option></select>
  </div>

  <button onclick="showCodes()">🔍 Show Codes</button>

  <div id="output"></div>

  <script>
    let lookupStructure = {};

    // 1. Initial page boot loader handshake config
    async function initPage() {
      try {
        const res = await fetch('/api/villagelookup?action=get_dropdowns');
        lookupStructure = await res.json();
        
        const districtSelect = document.getElementById("districtSelect");
        districtSelect.innerHTML = `<option>జిల్లా ఎంచుకోండి</option>`;
        
        Object.keys(lookupStructure).forEach(dist => {
          const opt = document.createElement("option");
          opt.value = opt.textContent = dist;
          districtSelect.appendChild(opt);
        });

        districtSelect.onchange = populateMandals;
      } catch (err) {
        console.error("Failed to load initial layout parameters:", err);
      }
    }
    initPage();

    function populateMandals() {
      const dist = document.getElementById("districtSelect").value;
      const mandalSelect = document.getElementById("mandalSelect");
      const villageSelect = document.getElementById("villageSelect");
      
      mandalSelect.innerHTML = `<option>మండలం ఎంచుకోండి</option>`;
      villageSelect.innerHTML = `<option>గ్రామం ఎంచుకోండి</option>`;
      document.getElementById("output").style.display = "none";

      if (!lookupStructure[dist]) return;

      Object.keys(lookupStructure[dist]).forEach(mandal => {
        const opt = document.createElement("option");
        opt.value = opt.textContent = mandal;
        mandalSelect.appendChild(opt);
      });

      mandalSelect.onchange = populateVillages;
    }

    function populateVillages() {
      const dist = document.getElementById("districtSelect").value;
      const mandal = document.getElementById("mandalSelect").value;
      const villageSelect = document.getElementById("villageSelect");
      
      villageSelect.innerHTML = `<option>గ్రామం ఎంచుకోండి</option>`;
      document.getElementById("output").style.display = "none";

      if (!lookupStructure[dist] || !lookupStructure[dist][mandal]) return;

      lookupStructure[dist][mandal].forEach(village => {
        const opt = document.createElement("option");
        opt.value = opt.textContent = village;
        villageSelect.appendChild(opt);
      });
    }

    // 2. Query target results processing engine
    async function showCodes() {
      const dist = document.getElementById("districtSelect").value;
      const mandal = document.getElementById("mandalSelect").value;
      const village = document.getElementById("villageSelect").value;
      const output = document.getElementById("output");

      if (dist.startsWith("జిల్లా") || mandal.startsWith("మండలం") || village.startsWith("గ్రామం")) {
        output.style.display = "block";
        output.innerHTML = `<p style='color:red; font-weight:bold;'>దయచేసి అన్ని ఎంపికలు పూర్తి చేయండి.</p>`;
        return;
      }

      output.style.display = "block";
      output.innerHTML = "🔍 Cloud Vault నుండి కోడ్‌లను సేకరిస్తోంది...";

      try {
        const url = `/api/villagelookup?action=lookup_codes&district=${encodeURIComponent(dist)}&mandal=${encodeURIComponent(mandal)}&village=${encodeURIComponent(village)}`;
        const res = await fetch(url);
        const codes = await res.json();

        if (codes.error) {
          output.innerHTML = `<p style='color:red;'>❌ ${codes.error}</p>`;
          return;
        }

        output.innerHTML = `
          <div style='border-bottom: 2px solid #0078D4; padding-bottom: 8px; margin-bottom: 12px;'>
            <strong>📍 District:</strong> ${dist} | <strong>🗺️ Mandal:</strong> ${mandal} | <strong>🏡 Village:</strong> ${village}
          </div>
          📍 <strong>District Code:</strong> ${codes.DIST_CODE}<br>
          🏢 <strong>District Census Code:</strong> ${codes.DIST_CENSUSCODE}<br>
          🏞️ <strong>Mandal Code:</strong> ${codes.MAND_CODE}<br>
          🗂️ <strong>Mandal Census Code:</strong> ${codes.MAND_CENSUSCODE}<br>
          🏡 <strong>Village Code:</strong> ${codes.VILL_CODE}<br>
          🧾 <strong>Census Village Code:</strong> ${codes.CENSUS_VILLAGECODE}
        `;
      } catch (err) {
        output.innerHTML = "<p style='color:red;'>క్లౌడ్ సర్వర్ కనెక్షన్ లోపం. మళ్లీ ప్రయత్నించండి.</p>";
      }
    }
  </script>
</body>
</html>
