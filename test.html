<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Excel Sl. No Prototype Test</title>
    <style>
        body { font-family: sans-serif; padding: 40px; text-align: center; }
        .box { border: 2px dashed #3498db; padding: 30px; display: inline-block; border-radius: 8px; }
        button { background: #27ae60; color: white; padding: 10px 20px; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>📊 Prototype Excel Test</h2>
    <p>Upload a simple Excel file (.xlsx) with a list of names to add Sl. No</p>

    <div class="box">
        <form id="testForm">
            <input type="file" id="fileInput" accept=".xlsx,.xls" required><br><br>
            <button type="submit">⚙️ Process & Add Sl. No</button>
        </form>
    </div>

    <div id="status"></div>

<script>
document.getElementById('testForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const fileInput = document.getElementById('fileInput');
    const statusDiv = document.getElementById('status');

    if (fileInput.files.length === 0) return;

    const formData = new FormData();
    formData.append('file', fileInput.files[0]);

    statusDiv.innerText = 'Processing Excel file...';

    try {
        const response = await fetch('/api/test_excel', {
            method: 'POST',
            body: formData
        });

        if (!response.ok) {
            let errorMsg = 'Server error occurred.';
            try {
                const errorData = await response.json();
                errorMsg = errorData.error || errorData.traceback || errorMsg;
            } catch (jsonErr) {
                // If Vercel returns plain text/HTML instead of JSON
                const textMsg = await response.text();
                errorMsg = `HTTP ${response.status}: ${textMsg.substring(0, 150)}...`;
            }
            throw new Error(errorMsg);
        }

        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'Processed_Names_With_SlNo.xlsx';
        document.body.appendChild(a);
        a.click();
        a.remove();

        statusDiv.innerText = '✅ Success! Excel downloaded.';
    } catch (err) {
        statusDiv.innerText = '❌ Failed: ' + err.message;
    }
});
</script>

</body>
</html>
