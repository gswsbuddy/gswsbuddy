<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mango Data Provider - Portal Report Processor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 90%;
            max-width: 550px;
            text-align: center;
        }
        h2 { color: #2C3E50; margin-bottom: 5px; }
        p.subtitle { color: #7F8C8D; font-size: 14px; margin-bottom: 25px; }
        
        .upload-box {
            border: 2px dashed #3498DB;
            border-radius: 8px;
            padding: 30px;
            background-color: #f8fbfe;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
        }
        .upload-box:hover { background-color: #ebf5fb; }
        input[type="file"] { display: none; }
        
        .btn {
            background-color: #27AE60;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        .btn:hover { background-color: #219150; }
        .btn:disabled { background-color: #BDC3C7; cursor: not-allowed; }
        
        #status { margin-top: 20px; font-size: 14px; font-weight: bold; }
        .error { color: #E74C3C; }
        .success { color: #27AE60; }
    </style>
</head>
<body>

<div class="container">
    <h2>🥭 Mango Data Provider</h2>
    <p class="subtitle">Upload e-Crop Portal Excel (.xls / .xlsx) to deduplicate & process extents</p>

    <form id="uploadForm">
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <span id="fileNameDisplay">📄 Click or Drag & Drop Excel File Here</span>
            <input type="file" id="fileInput" name="file" accept=".xls,.xlsx" required onchange="updateFileName()">
        </div>
        <button type="submit" id="processBtn" class="btn">⚙️ Process & Download Excel</button>
    </form>

    <div id="status"></div>
</div>

<script>
function updateFileName() {
    const fileInput = document.getElementById('fileInput');
    const display = document.getElementById('fileNameDisplay');
    if (fileInput.files.length > 0) {
        display.innerText = "Selected: " + fileInput.files[0].name;
    }
}

document.getElementById('uploadForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const fileInput = document.getElementById('fileInput');
    const statusDiv = document.getElementById('status');
    const processBtn = document.getElementById('processBtn');

    if (fileInput.files.length === 0) return;

    const formData = new FormData();
    formData.append('file', fileInput.files[0]);

    statusDiv.className = '';
    statusDiv.innerText = 'Processing file... Please wait.';
    processBtn.disabled = true;

    try {
        const response = await fetch('/api/process', {
            method: 'POST',
            body: formData
        });

        if (!response.ok) {
            const errorData = await response.json();
            throw new Error(errorData.error || 'Failed to process file.');
        }

        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'Mango_Crop_Processed_Summary.xlsx';
        document.body.appendChild(a);
        a.click();
        a.remove();

        statusDiv.className = 'success';
        statusDiv.innerText = '✅ Complete! File downloaded successfully.';
    } catch (err) {
        statusDiv.className = 'error';
        statusDiv.innerText = '❌ Error: ' + err.message;
    } finally {
        processBtn.disabled = false;
    }
});
</script>

</body>
</html>
