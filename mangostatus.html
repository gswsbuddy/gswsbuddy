<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mango Status</title>
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FKVZ9P09W5"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-FKVZ9P09W5');
</script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      padding: 20px;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #0078D4;
    }
    #dashboard {
      max-width: 900px;
      margin: 0 auto;
      background: #e8f0fe;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin-bottom: 10px;
    }
    button {
      padding: 10px 20px;
      background-color: #0078D4;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }
    #farmerInfo {
      margin-top: 20px;
      font-size: 18px;
      line-height: 1.6;
    }
    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
      background: white;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ccc;
      text-align: center;
    }
    th {
      background-color: #0078D4;
      color: white;
    }
  </style>
</head>
<body>
  <h1>🍋 Farmer Mango Status</h1>

  <div id="dashboard">
    <input type="text" id="aadhaarInput" placeholder="Enter Aadhaar Number">
    <button onclick="lookupDispatch()">🔍 Search </button>

    <div id="farmerInfo"></div>

    <table id="dispatchTable" style="display:none;">
      <thead>
        <tr>
          <th>S.No</th>
          <th>Pulp ID</th>
          <th>Procured Date</th>
          <th>Quantity (kgs)</th>
          <th>Amount (₹)</th>
          <th>Source</th>
          <th>Remarks</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
  let dispatchData = {};
  
  Promise.all([
  fetch("nestedmangodata.json").then(res => res.json()),
  fetch("nestedmangodata2.json").then(res => res.json())
]).then(([mainData, additionalData]) => {
  dispatchData = mainData;
  
  Object.entries(additionalData).forEach(([aadhaar, newFarmer]) => {
  if (!dispatchData[aadhaar]) {
    dispatchData[aadhaar] = newFarmer;
  } else {
    dispatchData[aadhaar].records.push(...newFarmer.records);
  }
});

});


    function lookupDispatch() {
      const aadhaar = document.getElementById("aadhaarInput").value.trim();
      const infoBox = document.getElementById("farmerInfo");
      const table = document.getElementById("dispatchTable");
      const tbody = table.querySelector("tbody");

      infoBox.innerHTML = "";
      tbody.innerHTML = "";
      table.style.display = "none";

      if (!aadhaar || !dispatchData[aadhaar]) {
  infoBox.innerHTML = `
    ❌ No records found for this Aadhaar number.<br>
    <strong>మీ రైతు సేవా కేంద్రాన్ని సంప్రదించగలరు.</strong>
  `;
  return;
}


      const farmer = dispatchData[aadhaar];

      // Show farmer details
      infoBox.innerHTML = `
      <strong>క్రింది వివరాలు 18-10-2025 తేధీ నాటివి మరిన్ని తాజా వివరాల కొరకు మీ రైతు సేవా కేంద్రాన్ని సంప్రదించగలరు.</strong><br>
        ✅ <strong>${farmer.farmer_name}</strong><br>
        🏡 Village: ${farmer.village_name}<br>
        🏞️ Mandal: ${farmer.mandal_name}<br>
        🏢 District: ${farmer.district_name}
      `;

      // Show dispatch records
      farmer.records.forEach((record, index) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${index + 1}</td>
          <td>${record.pulp_id}</td>
          <td>${record.procured_date}</td>
          <td>${record.procured_qty}</td>
          <td>${record.grand_total_amount}</td>
          <td>${record.pulp_ramp_mandi}</td>
          <td>${record.remarks}</td>
        `;
        tbody.appendChild(row);
      });

      table.style.display = "table";
    }

  </script>
</body>
</html>
