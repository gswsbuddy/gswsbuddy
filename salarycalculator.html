<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GSWS Buddy Salary Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4faff;
      padding: 20px;
    }
    h2 {
      text-align: center;
      color: #005a9c;
    }
    label {
      font-weight: bold;
    }
    form {
      max-width: 500px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin: 8px 0 16px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background: #005a9c;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #output {
      margin-top: 30px;
      background: #e8f0fe;
      padding: 20px;
      border-radius: 10px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>
  <h2>GSWS Buddy Salary Calculator</h2>
  <form id="salaryForm">
    <label for="basic">Basic Pay (₹):</label>
    <input type="number" id="basic" required>

    <label for="hra">HRA Rate (%):</label>
    <select id="hra" required>
      <option value="10">10%</option>
      <option value="12">12%</option>
      <option value="16">16%</option>
    </select>

    <label for="apgli">APGLI (₹):</label>
    <input type="number" id="apgli" required>

    <button type="button" onclick="calculateSalary()">Calculate</button>
  </form>

  <div id="output"></div>

  <script>
  function calculateSalary() {
  const basic = parseFloat(document.getElementById('basic').value);
  const hraRate = parseFloat(document.getElementById('hra').value);
  const apgli = parseFloat(document.getElementById('apgli').value);

  if (isNaN(basic) || isNaN(hraRate) || isNaN(apgli)) {
    alert("Please fill in all fields correctly.");
    return;
  }

  // Earnings
  const hra = (hraRate / 100) * basic;
  const da = (37.31 / 100) * basic;
  const totalEarnings = basic + hra + da;

  // Deductions
  const gis = 15;
  const pt = 200;
  const ehs = 225;
  const cps = 0.10 * (basic + da);
  const totalDeductions = apgli + gis + pt + ehs + cps;

  const netSalary = totalEarnings - totalDeductions;

  // Display Output
  document.getElementById("output").innerHTML = `
    <h3>Salary Summary</h3>
    <p><strong>Basic Pay:</strong> ₹${basic.toFixed(2)}</p>
    <p><strong>HRA (${hraRate}%):</strong> ₹${hra.toFixed(2)}</p>
    <p><strong>DA (37.31%):</strong> ₹${da.toFixed(2)}</p>
    <p><strong>Total Earnings:</strong> ₹${totalEarnings.toFixed(2)}</p>
    <hr>
    <p><strong>APGLI:</strong> ₹${apgli.toFixed(2)}</p>
    <p><strong>GIS Fund:</strong> ₹15.00</p>
    <p><strong>Professional Tax:</strong> ₹200.00</p>
    <p><strong>EHS Subscription:</strong> ₹225.00</p>
    <p><strong>CPS (10% of Basic + DA):</strong> ₹${cps.toFixed(2)}</p>
    <p><strong>Total Deductions:</strong> ₹${totalDeductions.toFixed(2)}</p>
    <hr>
    <h3><strong>Net Salary:</strong> ₹${netSalary.toFixed(2)}</h3>
  `;
}
fetch("https://api.countapi.xyz/hit/gswsbuddy/total-visits");

</script>
</body>
</html>
