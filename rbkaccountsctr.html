<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>APMARKFED Account Lookup</title>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FKVZ9P09W5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-FKVZ9P09W5');
  </script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f4f6f8;
    }
    h2 {
      color: #0078D4;
      text-align: center;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      color: #333;
    }
    select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 14px;
      background-color: #fff;
    }
    select:focus {
      outline: none;
      border-color: #0078D4;
      box-shadow: 0 0 4px rgba(0, 120, 212, 0.3);
    }
    .dropdown-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    #lookupBtn {
      margin-top: 30px;
      padding: 10px 20px;
      background-color: #0078D4;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    #lookupBtn:hover {
      background-color: #005a9e;
    }
    #accountDetails {
      margin-top: 30px;
      padding: 20px;
      background-color: #ffffff;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      color: #333;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    #accountDetails p {
      margin: 8px 0;
    }
    #resetBtn {
      margin-left: 10px;
      padding: 10px 20px;
      background-color: #dc3545;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    #resetBtn:hover {
      background-color: #c82333;
    }
  </style>
</head>
<body>
  <h2>🔍 APMARKFED Account Number Finder</h2>

  <div class="dropdown-group">
    <div>
      <label for="districtDropdown">District</label>
      <select id="districtDropdown"><option>Select District</option></select>
    </div>
    <div>
      <label for="mandalDropdown">Mandal</label>
      <select id="mandalDropdown"><option>Select Mandal</option></select>
    </div>
    <div>
      <label for="rbkDropdown">RBK Name</label>
      <select id="rbkDropdown"><option>Select RBK</option></select>
    </div>
  </div>

  <button id="lookupBtn">🔎 Submit</button>
  <button id="resetBtn">🔄 Reset</button>

  <div id="accountDetails"></div>

  <script>
    // This array holds only the safe mapping structure (District -> Mandal -> RBK Name)
    // No sensitive bank account details are loaded here!
    let dropdownMapping = [];

    async function loadDropdowns() {
      try {
        // Ask our backend chef for just the menu layout mapping list
        const response = await fetch('/api/accounts?action=get_mapping'); 
        dropdownMapping = await response.json();

        const districts = [...new Set(dropdownMapping.map(d => d.District))];
        const districtDropdown = document.getElementById("districtDropdown");
        districts.forEach(d => {
          const opt = document.createElement("option");
          opt.value = opt.textContent = d;
          districtDropdown.appendChild(opt);
        });
      } catch (e) {
        console.error("Error initializing dropdown items from backend:", e);
      }
    }

    loadDropdowns();

    const districtDropdown = document.getElementById("districtDropdown");
    const mandalDropdown = document.getElementById("mandalDropdown");
    const rbkDropdown = document.getElementById("rbkDropdown");
    const accountDetails = document.getElementById("accountDetails");

    // Cascading Filter: When District changes, populate Mandals
    districtDropdown.addEventListener("change", () => {
      mandalDropdown.innerHTML = "<option>Select Mandal</option>";
      rbkDropdown.innerHTML = "<option>Select RBK</option>";
      accountDetails.innerHTML = "";

      const selectedDistrict = districtDropdown.value;
      if(selectedDistrict === "Select District") return;

      const mandals = [...new Set(dropdownMapping.filter(d => d.District === selectedDistrict).map(d => d.MANDAL))];
      mandals.forEach(m => {
        const opt = document.createElement("option");
        opt.value = opt.textContent = m;
        mandalDropdown.appendChild(opt);
      });
    });

    // Cascading Filter: When Mandal changes, populate RBKs
    mandalDropdown.addEventListener("change", () => {
      rbkDropdown.innerHTML = "<option>Select RBK</option>";
      accountDetails.innerHTML = "";

      const selectedDistrict = districtDropdown.value;
      const selectedMandal = mandalDropdown.value;
      if(selectedMandal === "Select Mandal") return;

      const rbks = dropdownMapping
        .filter(d => d.District === selectedDistrict && d.MANDAL === selectedMandal)
        .map(d => d["RBK Name"]);

      [...new Set(rbks)].forEach(rbk => {
        const opt = document.createElement("option");
        opt.value = opt.textContent = rbk;
        rbkDropdown.appendChild(opt);
      });
    });

    // The secure lookup handler: request the row information only upon submission click
    document.getElementById("lookupBtn").addEventListener("click", async () => {
      const selectedDistrict = districtDropdown.value;
      const selectedMandal = mandalDropdown.value;
      const selectedRBK = rbkDropdown.value;

      if (
        selectedDistrict === "Select District" ||
        selectedMandal === "Select Mandal" ||
        selectedRBK === "Select RBK"
      ) {
        accountDetails.innerHTML = `<p style="color:red;">⚠️ Please select all fields before submitting.</p>`;
        return;
      }

      accountDetails.innerHTML = "🔍 Querying secure cloud vault...";

      try {
        const url = `/api/accounts?action=lookup&district=${encodeURIComponent(selectedDistrict)}&mandal=${encodeURIComponent(selectedMandal)}&rbk=${encodeURIComponent(selectedRBK)}`;
        
        const response = await fetch(url);
        const result = await response.json();

        if (result.error) {
          accountDetails.innerHTML = `<p style="color:red;">❌ ${result.error}</p>`;
        } else {
          accountDetails.innerHTML = `
            <p><strong>District:</strong> ${selectedDistrict}</p>
            <p><strong>Mandal:</strong> ${selectedMandal}</p>
            <p><strong>RBK Name:</strong> ${selectedRBK}</p>
            <p><strong>Account Number:</strong> <span style="color: #2e7d32; font-weight: bold; font-size: 1.1em;">${result.account}</span></p>
            <p><strong>IFSC Code:</strong> ${result.ifsc}</p>
            <p><strong>SBU Name:</strong> ${result.sbu}</p>
          `;
        }
      } catch (error) {
        accountDetails.innerHTML = `<p style="color:red;">❌ Cloud connection error. Please try again.</p>`;
      }
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      districtDropdown.selectedIndex = 0;
      mandalDropdown.innerHTML = "<option>Select Mandal</option>";
      rbkDropdown.innerHTML = "<option>Select RBK</option>";
      accountDetails.innerHTML = "";
    });
  </script>
</body>
</html>
