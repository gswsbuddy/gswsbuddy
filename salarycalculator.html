<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GSWS Buddy Salary Calculator</title>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FKVZ9P09W5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-FKVZ9P09W5');
  </script>
  <style>
    body { font-family: Arial, sans-serif; background: #f4faff; padding: 20px; }
    h2 { text-align: center; color: #005a9c; }
    label { font-weight: bold; display: block; margin-top: 10px; }
    .form-container { max-width: 500px; margin: auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 0 8px rgba(0,0,0,0.1); }
    input, select, button { width: 100%; padding: 10px; margin: 8px 0 16px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; font-size: 15px; }
    button { background: #005a9c; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:hover { background-color: #004475; }
    
    /* Toggleable Advanced Section Styles */
    .advanced-toggle { color: #005a9c; font-weight: bold; cursor: pointer; text-align: center; margin: 15px 0; user-select: none; font-size: 14px; }
    .advanced-toggle:hover { text-decoration: underline; }
    .deduction-drawer { display: none; background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px dashed #bbb; margin-bottom: 16px; }
    .deduction-drawer label { font-size: 13px; color: #555; }
    .deduction-drawer input { background: #fff; margin: 4px 0 12px 0; padding: 8px; font-size: 14px; }
    
    #output { margin-top: 30px; background: #e8f0fe; padding: 20px; border-radius: 10px; max-width: 500px; margin-left: auto; margin-right: auto; display: none; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
  </style>
</head>
<body>

  <h2>GSWS Buddy Salary Calculator</h2>
  
  <div class="form-container">
    <label for="basic">Basic Pay (₹):</label>
    <input type="number" id="basic" placeholder="e.g. 22460" required>

    <label for="hra">HRA Rate (%):</label>
    <select id="hra" required>
      <option value="10">10%</option>
      <option value="12">12%</option>
      <option value="16">16%</option>
    </select>

    <label for="apgli">APGLI (₹):</label>
    <input type="number" id="apgli" placeholder="e.g. 500" required>

    <div class="advanced-toggle" onclick="toggleDrawer()">⚙️ View / Edit Standard Deductions</div>
    
    <div id="deductionDrawer" class="deduction-drawer">
      <label for="gis">GIS Fund (₹):</label>
      <input type="number" id="gis" value="15">

      <label for="pt">Professional Tax (₹):</label>
      <input type="number" id="pt" value="200">

      <label for="ehs">EHS Subscription (₹):</label>
      <input type="number" id="ehs" value="225">
    </div>

    <button type="button" onclick="calculateSalary()">Calculate</button>
  </div>

  <div id="output"></div>

  <script>
    function toggleDrawer() {
      const drawer = document.getElementById("deductionDrawer");
      if (drawer.style.display === "block") {
        drawer.style.display = "none";
      } else {
        drawer.style.display = "block";
      }
    }

    async function calculateSalary() {
      const basicVal = document.getElementById('basic').value.trim();
      const hraRateVal = document.getElementById('hra').value;
      const apgliVal = document.getElementById('apgli').value.trim();
      
      // Reading dynamic deduction user overrides
      const gisVal = document.getElementById('gis').value.trim();
      const ptVal = document.getElementById('pt').value.trim();
      const ehsVal = document.getElementById('ehs').value.trim();
      
      const outputDiv = document.getElementById("output");

      if (!basicVal || !apgliVal || isNaN(basicVal) || isNaN(apgliVal)) {
        outputDiv.style.display = "block";
        outputDiv.innerHTML = "<p style='color:red; font-weight:bold;'>⚠️ Please fill in Basic Pay and APGLI parameters before calculating.</p>";
        return;
      }

      outputDiv.style.display = "block";
      outputDiv.innerHTML = "📊 Computing official salary breakdowns across cloud systems...";

      try {
        // Appending user overrides into the query string parameters array safely
        const url = `/api/salary_calculator?basic=${encodeURIComponent(basicVal)}&hra_rate=${encodeURIComponent(hraRateVal)}&apgli=${encodeURIComponent(apgliVal)}&gis=${encodeURIComponent(gisVal)}&pt=${encodeURIComponent(ptVal)}&ehs=${encodeURIComponent(ehsVal)}`;
        const res = await fetch(url);
        const data = await res.json();

        outputDiv.innerHTML = `
          <h3>Salary Summary</h3>
          <p><strong>Basic Pay:</strong> ₹${data.basic.toFixed(2)}</p>
          <p><strong>HRA (${data.hra_rate}%):</strong> ₹${data.hra.toFixed(2)}</p>
          <p><strong>DA (${data.da_percent}%):</strong> ₹${data.da.toFixed(2)}</p>
          <p><strong>Total Earnings (Gross):</strong> ₹${data.total_earnings.toFixed(2)}</p>
          <hr style='border: 0; border-top: 1px solid #ccc;'>
          <p><strong>APGLI Recovery:</strong> ₹${data.apgli.toFixed(2)}</p>
          <p><strong>GIS Fund:</strong> ₹${data.gis.toFixed(2)}</p>
          <p><strong>Professional Tax (PT):</strong> ₹${data.pt.toFixed(2)}</p>
          <p><strong>EHS Subscription:</strong> ₹${data.ehs.toFixed(2)}</p>
          <p><strong>CPS Subscription (10% of Basic+DA):</strong> ₹${data.cps.toFixed(2)}</p>
          <p><strong>Total Deductions:</strong> ₹${data.total_deductions.toFixed(2)}</p>
          <hr style='border: 0; border-top: 2px solid #005a9c;'>
          <h3 style='color:#005a9c; margin-bottom:0;'><strong>Take-Home Net Salary:</strong> ₹${data.net_salary.toFixed(2)}</h3>
        `;
      } catch (err) {
        outputDiv.innerHTML = "<p style='color:red;'>❌ Cloud connection timeout error. Please check backend execution status.</p>";
      }
    }
  </script>
</body>
</html>
