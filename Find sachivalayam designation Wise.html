<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sachivalayam Finder</title>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FKVZ9P09W5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-FKVZ9P09W5');
  </script>
  <style>
    body { font-family: Arial, sans-serif; background: #f4faff; padding: 20px; }
    h2 { text-align: center; color: #005a9c; }
    label { font-weight: bold; display: block; margin-top: 10px; }
    .form-container { max-width: 400px; margin: auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 0 8px rgba(0,0,0,0.1); }
    select, button { width: 100%; padding: 10px; margin: 8px 0 16px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; font-size: 14px; }
    #submitBtn { background-color: #0078D4; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
    #submitBtn:hover { background-color: #005a9e; }
    #output { margin-top: 30px; background: #e8f0fe; padding: 20px; border-radius: 10px; max-width: 600px; margin-left: auto; margin-right: auto; display: none; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ccc; }
    th { background-color: #dbe9ff; color: #003366; }
    .yes { color: green; font-weight: bold; }
    .no { color: red; font-weight: bold; }
  </style>
</head>
<body>

  <h2>Find Sachivalayams by Designation</h2>

  <div class="form-container">
    <label for="district">District:</label>
    <select id="district"><option value="">-- Select District --</option></select>

    <label for="mandal">Mandal:</label>
    <select id="mandal"><option value="">-- Select Mandal --</option></select>

    <label for="designation">Designation:</label>
    <select id="designation"><option value="">-- Select Designation --</option></select>

    <label for="filter">Show Results:</label>
    <select id="filter">
      <option value="ALL">All</option>
      <option value="YES">YES POSITIONS ONLY</option>
      <option value="NO">NO POSITIONS ONLY</option> 
    </select>
    
    <button id="submitBtn">Submit</button>
  </div>

  <div id="output"></div>

  <script>
    let mappingData = {};

    async function initPage() {
      try {
        const res = await fetch('/api/designation_finder?action=get_dropdowns');
        const data = await res.json();
        
        mappingData = data.mapping;
        
        // Populate Districts
        const districtSelect = document.getElementById("district");
        Object.keys(mappingData).forEach(dist => {
          const opt = document.createElement("option");
          opt.value = opt.textContent = dist;
          districtSelect.appendChild(opt);
        });

        // Populate Designations
        const desigSelect = document.getElementById("designation");
        data.designations.forEach(d => {
          const opt = document.createElement("option");
          opt.value = opt.textContent = d;
          desigSelect.appendChild(opt);
        });
      } catch (err) {
        console.error("Initialization error:", err);
      }
    }
    initPage();

    const districtSelect = document.getElementById("district");
    const mandalSelect = document.getElementById("mandal");
    const outputDiv = document.getElementById("output");

    districtSelect.addEventListener("change", () => {
      mandalSelect.innerHTML = '<option value="">-- Select Mandal --</option>';
      outputDiv.style.display = "none";
      
      if (!mappingData[districtSelect.value]) return;
      Object.keys(mappingData[districtSelect.value]).forEach(mandal => {
        const opt = document.createElement("option");
        opt.value = opt.textContent = mandal;
        mandalSelect.appendChild(opt);
      });
    });

    document.getElementById("submitBtn").addEventListener("click", async () => {
      const dist = districtSelect.value;
      const mnd = mandalSelect.value;
      const desig = document.getElementById("designation").value;
      const filterVal = document.getElementById("filter").value;

      if (!dist || !mnd || !desig) {
        outputDiv.style.display = "block";
        outputDiv.innerHTML = "<p style='color:red; font-weight:bold;'>⚠️ Please select all fields before submitting.</p>";
        return;
      }

      outputDiv.style.display = "block";
      outputDiv.innerHTML = "🔍 Fetching designations from secure database...";

      try {
        const url = `/api/designation_finder?action=filter_by_designation&district=${encodeURIComponent(dist)}&mandal=${encodeURIComponent(mnd)}&designation=${encodeURIComponent(desig)}&filter=${filterVal}`;
        const res = await fetch(url);
        const results = await res.json();

        if (results.length === 0) {
          outputDiv.innerHTML = "<p style='color:red;'>No matching records found.</p>";
          return;
        }

        let html = `<table><tr><th>Sachivalayam Name</th><th>${desig}</th></tr>`;
        results.forEach(r => {
          html += `<tr>
            <td>${r.name}</td>
            <td class="${r.approved === 'YES' ? 'yes' : 'no'}">${r.approved}</td>
          </tr>`;
        });
        html += `</table>`;
        outputDiv.innerHTML = html;
      } catch (err) {
        outputDiv.innerHTML = "<p style='color:red;'>Cloud connection error.</p>";
      }
    });
  </script>
</body>
</html>
