<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Urea Tokens Generator</title>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FKVZ9P09W5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-FKVZ9P09W5');
  </script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f6f8; }
    h2 { color: #0078D4; text-align: center; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    .form-container { max-width: 450px; margin: auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 0 12px rgba(0,0,0,0.1); }
    input { width: 100%; padding: 10px; margin-top: 6px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; font-size: 15px; }
    button { width: 100%; margin-top: 25px; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; background-color: #0078D4; color: white; transition: background 0.3s ease; }
    button:hover { background-color: #005a9e; }
    #statusMessage { text-align: center; margin-top: 15px; font-weight: bold; color: #005a9c; display: none; }
  </style>
</head>
<body>

  <h2>🧾 Urea Tokens Generator</h2>

  <div class="form-container">
    <form id="tokenForm">
      <label for="distDate">Distribution Date:</label>
      <input type="date" id="distDate" required>

      <label for="rskName">RSK Name:</label>
      <input type="text" id="rskName" placeholder="e.g. Chittoor" required>

      <label for="mandal">Mandal:</label>
      <input type="text" id="mandal" placeholder="e.g. Chittoor" required>

      <label for="tokenCount">Number of Tokens to Print:</label>
      <input type="number" id="tokenCount" min="1" max="500" value="100" required>

      <button type="submit" id="genBtn">🚀 Generate Print-Ready Word File</button>
    </form>
    
    <div id="statusMessage"></div>
  </div>

  <script>
    document.getElementById("tokenForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const dateVal = document.getElementById("distDate").value;
      const rskVal = document.getElementById("rskName").value.trim();
      const mandalVal = document.getElementById("mandal").value.trim();
      const countVal = document.getElementById("tokenCount").value;
      const msgBox = document.getElementById("statusMessage");
      const btn = document.getElementById("genBtn");

      if (!dateVal || !rskVal || !mandalVal || !countVal) {
        alert("Please complete all parameter settings fields properly.");
        return;
      }

      msgBox.style.display = "block";
      msgBox.innerHTML = "⏳ Compiling structural document alignment elements on cloud backends...";
      btn.disabled = true;
      btn.style.background = "#aaaaaa";

      // Direct clean file-download generation request URL structure sequence
      const targetUrl = `/api/tokengenerator?date=${encodeURIComponent(dateVal)}&rsk=${encodeURIComponent(rskVal)}&mandal=${encodeURIComponent(mandalVal)}&count=${encodeURIComponent(countVal)}`;
      
      // Prompt the browser window engine to treat the server request directly as an explicit file download link
      window.location.href = targetUrl;

      // Restore form button state after transmission handoff completes smoothly
      setTimeout(() => {
        msgBox.innerHTML = "✅ Token compilation download processing initialized!";
        btn.disabled = false;
        btn.style.background = "#0078D4";
      }, 3000);
    });
  </script>

</body>
</html>
