<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Know your Sachivalayam (Rural)</title>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FKVZ9P09W5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-FKVZ9P09W5');
  </script>
  <style>
    body { font-family: Arial, sans-serif; background: #f4faff; padding: 20px; }
    h2 { text-align: center; color: #005a9c; }
    label { font-weight: bold; display: block; margin-top: 10px; }
    select, input { width: 100%; padding: 10px; margin: 8px 0 16px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
    form-container { max-width: 400px; margin: auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 0 8px rgba(0,0,0,0.1); display: block; }
    .button-group { text-align: center; margin-bottom: 20px; }
    .button-group button, #nameSubmitBtn, #codeLookupBtn { padding: 10px 20px; margin: 10px 5px; background-color: #0078D4; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; transition: background-color 0.3s ease; }
    .button-group button:hover, #nameSubmitBtn:hover, #codeLookupBtn:hover { background-color: #005a9e; }
    #rationalised-output, #code-output { margin-top: 20px; padding: 20px; background-color: #e9eff0; border-radius: 6px; max-width: 500px; margin-left: auto; margin-right: auto; }
  </style>
</head>
<body>

  <h2>🔍 Know your Sachivalayam (Rural)</h2>
  
  <div class="button-group">
    <button id="nameSearchBtn">Search by Name</button>
    <button id="codeSearchBtn">Search by Secretariat Code</button>
  </div>

  <div id="formWrapper" class="form-container" style="max-width: 450px; margin: auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 0 8px rgba(0,0,0,0.1);">
    
    <div id="nameSearchSection" style="display: none;">
      <label for="district">District:</label>
      <select id="district"><option>-- Select District --</option></select>

      <label for="mandal">Mandal:</label>
      <select id="mandal"><option>-- Select Mandal --</option></select>

      <label for="secretariat">Secretariat:</label>
      <select id="secretariat"><option>-- Select Secretariat --</option></select>

      <button id="nameSubmitBtn">Submit</button>
    </div>

    <div id="codeSearchSection" style="display: none;">
      <label for="sachCodeInput">Enter Secretariat Code:</label>
      <input type="text" id="sachCodeInput" placeholder="e.g. 11290193">
      <button type="button" id="codeLookupBtn">Submit</button>
    </div>

  </div>

  <div id="rationalised-output" style="display:none;"></div>
  <div id="code-output" style="display:none;"></div>

  <script>
    let structureData = {};

    // Tab Toggle Engine
    document.getElementById("nameSearchBtn").addEventListener("click", () => {
      document.getElementById("nameSearchSection").style.display = "block";
      document.getElementById("codeSearchSection").style.display = "none";
      clearOutputs();
    });

    document.getElementById("codeSearchBtn").addEventListener("click", () => {
      document.getElementById("nameSearchSection").style.display = "none";
      document.getElementById("codeSearchSection").style.display = "block";
      clearOutputs();
    });

    function clearOutputs() {
      document.getElementById("rationalised-output").style.display = "none";
      document.getElementById("code-output").style.display = "none";
    }

    // 1. Safe layout structure configuration download
    async function initPage() {
      try {
        const res = await fetch("/api/sachivalayam?action=get_dropdowns");
        structureData = await res.json();
        
        const districtSelect = document.getElementById("district");
        Object.keys(structureData).forEach(district => {
          const opt = document.createElement("option");
          opt.value = opt.textContent = district;
          districtSelect.appendChild(opt);
        });
      } catch (err) {
        console.error("Initialization failed.");
      }
    }
    initPage();

    // Cascading Dropdown Handlers
    const districtSelect = document.getElementById("district");
    const mandalSelect = document.getElementById("mandal");
    const secretariatSelect = document.getElementById("secretariat");

    districtSelect.addEventListener("change", () => {
      mandalSelect.innerHTML = '<option>-- Select Mandal --</option>';
      secretariatSelect.innerHTML = '<option>-- Select Secretariat --</option>';
      
      if (!structureData[districtSelect.value]) return;
      Object.keys(structureData[districtSelect.value]).forEach(mandal => {
        const opt = document.createElement("option");
        opt.value = opt.textContent = mandal;
        mandalSelect.appendChild(opt);
      });
    });

    mandalSelect.addEventListener("change", () => {
      secretariatSelect.innerHTML = '<option>-- Select Secretariat --</option>';
      if (!structureData[districtSelect.value][mandalSelect.value]) return;
      
      structureData[districtSelect.value][mandalSelect.value].forEach(sach => {
        const opt = document.createElement("option");
        opt.value = opt.textContent = sach;
        secretariatSelect.appendChild(opt);
      });
    });

    // 2. Lookup Handler by Name
    document.getElementById("nameSubmitBtn").addEventListener("click", async () => {
      const dist = districtSelect.value;
      const mnd = mandalSelect.value;
      const sec = secretariatSelect.value;
      const output = document.getElementById("rationalised-output");

      if (dist.startsWith("--") || mnd.startsWith("--") || sec.startsWith("--")) {
        output.style.display = "block";
        output.innerHTML = `<p style="color:red;">Please select all fields completely.</p>`;
        return;
      }

      output.style.display = "block";
      output.innerHTML = "🔍 Checking Cloud Master Registry...";

      try {
        const url = `/api/sachivalayam?action=lookup_by_name&district=${encodeURIComponent(dist)}&mandal=${encodeURIComponent(mnd)}&secretariat=${encodeURIComponent(sec)}`;
        const res = await fetch(url);
        const details = await res.json();

        output.innerHTML = `
          <h3>📌 Secretariat: ${sec}</h3>
          <p><strong>🆔 Code:</strong> ${details["Seccretariat Code"]}</p>
          <p><strong>🏡 Rural/Urban:</strong> ${details["Rural / Urban"]}</p>
          <p><strong>📊 Population Category:</strong> ${details["Population Category"]}</p>
          <h4>👥 Designated Roles:</h4>
          <ul>
            ${Object.entries(details.Designations)
              .map(([role, status]) => `<li>${role}: ${status === "YES" ? "✅" : "❌"}</li>`)
              .join("")}
          </ul>
        `;
      } catch (err) {
        output.innerHTML = "<p style="color:red;">Error fetching data.</p>";
      }
    });

    // 3. Lookup Handler by Numeric Code
    document.getElementById("codeLookupBtn").addEventListener("click", async () => {
      const codeInput = document.getElementById("sachCodeInput").value.trim();
      const codeOutput = document.getElementById("code-output");

      if (!codeInput) {
        codeOutput.style.display = "block";
        codeOutput.innerHTML = `<p style="color:red;">Please enter a valid code number.</p>`;
        return;
      }

      codeOutput.style.display = "block";
      codeOutput.innerHTML = "🔍 Decrypting Code Vault...";

      try {
        const url = `/api/sachivalayam?action=lookup_by_code&code=${encodeURIComponent(codeInput)}`;
        const res = await fetch(url);
        const result = await res.json();

        if (result.error) {
          codeOutput.innerHTML = `<p style="color:red;">❌ ${result.error}</p>`;
        } else {
          codeOutput.innerHTML = `
            <h3>📌 Secretariat: ${result.sachivalayam}</h3>
            <p><strong>🆔 Code:</strong> ${result.code}</p>
            <p><strong>📍 District:</strong> ${result.district}</p>
            <p><strong>🗺️ Mandal:</strong> ${result.mandal}</p>
            <p><strong>🏡 Rural/Urban:</strong> ${result.type}</p>
            <p><strong>📊 Population Category:</strong> ${result.category}</p>
            <h4>👥 Designated Roles:</h4>
            <ul>
              ${Object.entries(result.designations)
                .map(([role, status]) => `<li>${role}: ${status === "YES" ? "✅" : "❌"}</li>`)
                .join("")}
            </ul>
          `;
        }
      } catch (err) {
        codeOutput.innerHTML = "<p style="color:red;">Server connection error.</p>";
      }
    });
  </script>
</body>
</html>
